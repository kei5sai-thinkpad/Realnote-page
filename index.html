<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>NoteCord</title>
  <style>
  body { margin: 0; font-family: sans-serif; background: #0f172a; color: white; display: flex; height: 100vh; } .sidebar { width: 280px; background: #020617; padding: 15px; border-right: 1px solid #1e293b; } .room { padding: 10px; border-radius: 10px; cursor: pointer; margin-bottom: 6px; background: #111827; } .room:hover { background: #1e293b; } .main { flex: 1; display: flex; flex-direction: column; } .header { padding: 15px 20px; background: #020617; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; } #note { flex: 1; padding: 20px; outline: none; overflow: auto; white-space: pre-wrap; font-size: 16px; line-height: 1.6; } .typing { padding: 10px 20px; color: #94a3b8; min-height: 24px; } input, button, select { width: 100%; padding: 10px; margin-top: 10px; border-radius: 10px; border: none; box-sizing: border-box; } button { background: #3b82f6; color: white; cursor: pointer; }
  </style>
</head>

<body>
  <div class="sidebar">
    <h2>Rooms</h2>
    <div id="rooms">
    </div>
    <input id="roomInput" placeholder="部屋名">
    <select id="roomType">
      <option value="shared">共有ノート</option>
      <option value="readonly">閲覧専用ノート</option>
    </select>
    <button onclick="accessRoom()">入室 / 作成</button>
  </div>
  <div class="main">
    <div class="header">
      <span id="currentRoom">未接続</span>
      <div style="display:flex; gap:10px; align-items:center;">
        <button onclick="copyInviteLink()" style="width:auto;">招待リンク生成</button>
        <span id="modeLabel">
        </span>
      </div>
    </div>
    <div id="note" contenteditable="true">ノートに入室した時に表示されます</div>
    <div class="typing" id="typing">
    </div>
  </div>
  <script>
  let username = null; let ws; let isUpdating = false; let currentRoomName = ""; let username = localStorage.getItem("notecord_username"); if (!username) { username = prompt("ユーザー名を入力してください"); if (!username || username.trim() === "") { username = "User" + Math.floor(Math.random() * 1000); } localStorage.setItem("notecord_username", username); } function escapeHtml(text) { const div = document.createElement("div"); div.innerText = text; return div.innerHTML; } function formatCodeBlocks(text) { const regex = new RegExp( "
  ([a-zA-Z0-9]+)?\\n([\\s\\S]*?)
  ", "g" ); return text.replace(regex, function(match, lang, code) { return <div style=" background:#111827; border:1px solid #334155; border-radius:14px; margin:14px 0; overflow:hidden; "> <div style=" background:#0b1220; padding:10px 14px; border-bottom:1px solid #334155; font-size:13px; font-weight:bold; color:#cbd5e1; "> ${lang || "code"}  <pre style=" margin:0; padding:16px; font-family:Consolas, monospace; font-size:14px; line-height:1.7; white-space:pre-wrap; overflow-x:auto; color:white; ">${escapeHtml(code)}  ; }); } async function loadRooms() { const res = await fetch("/rooms"); const rooms = await res.json(); const container = document.getElementById("rooms"); container.innerHTML = ""; rooms.forEach(room => { const div = document.createElement("div"); div.className = "room"; div.innerText = room.name + " (" + room.label + ")"; div.onclick = () => quickJoin(room.name); container.appendChild(div); }); } function quickJoin(name) { document.getElementById("roomInput").value = name; accessRoom(); } async function accessRoom() { const room = document.getElementById("roomInput").value.trim(); const type = document.getElementById("roomType").value; if (!room) { alert("部屋名を入力してください"); return; } const password = prompt("パスワード（空でもOK）を入力してください") || ""; const res = await fetch("/join-room", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ room: room, password: password, room_type: type, username: username }) }); const result = await res.json(); if (!result.success) { alert(result.message); return; } connectRoom(room, result.can_edit, result.label); loadRooms(); } function connectRoom(room, canEdit, label) { currentRoomName = room; document.getElementById("currentRoom").innerText = "# " + room; document.getElementById("modeLabel").innerText = label; const note = document.getElementById("note"); note.contentEditable = canEdit ? "true" : "false"; if (ws) ws.close(); ws = new WebSocket( (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/" + room ); ws.onmessage = (event) => { const data = JSON.parse(event.data); if (data.type === "init" || data.type === "update") { isUpdating = true; note.innerHTML = formatCodeBlocks(data.text); isUpdating = false; } if (data.type === "typing") { const typing = document.getElementById("typing"); typing.innerText = data.user + " が入力中..."; setTimeout(() => typing.innerText = "", 1000); } }; note.oninput = () => { if (!canEdit) return; if ( ws && ws.readyState === WebSocket.OPEN && !isUpdating ) { ws.send(JSON.stringify({ type: "update", text: note.innerText })); ws.send(JSON.stringify({ type: "typing", user: username })); } }; } /* 招待リンク */ function copyInviteLink() { if (!currentRoomName) { alert("先に部屋へ入室してください"); return; } const inviteLink = location.origin + "/?room=" + encodeURIComponent(currentRoomName); navigator.clipboard.writeText(inviteLink) .then(() => { alert("招待リンクをコピーしました！"); }) .catch(() => { alert("コピーに失敗しました"); }); } /* URLから自動入室 */ window.onload = async () => { await loadRooms(); const params = new URLSearchParams(window.location.search); const room = params.get("room"); if (room) { document.getElementById("roomInput").value = room; accessRoom(); } };
  </script>
</body>

</html>
