<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteCord</title>

<style>
/* ===== モバイル対応 ===== */
@media (max-width: 768px) {
    body { flex-direction: column; }

    .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        width: 80%;
        height: 100%;
        z-index: 1000;
        transition: 0.3s;
    }

    .sidebar.open { left: 0; }

    .main { width: 100%; height: 100%; }

    .header { padding: 10px; }

    #note { padding: 15px; font-size: 15px; }

    button { padding: 14px; font-size: 16px; }
}

/* ハンバーガー */
.menu-btn {
    background: #1e293b;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
}

/* ===== 元のCSS ===== */
body {
    margin: 0;
    font-family: sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 280px;
    background: #020617;
    padding: 15px;
    border-right: 1px solid #1e293b;
}

.room {
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
    background: #111827;
}

.room:hover { background: #1e293b; }

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 15px 20px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#note {
    flex: 1;
    padding: 20px;
    outline: none;
    overflow: auto;
    white-space: pre-wrap;
    font-size: 16px;
}

.typing {
    padding: 10px 20px;
    color: #94a3b8;
}

input, button, select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
}

button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Rooms</h2>
    <div id="rooms"></div>

    <input id="roomInput" placeholder="部屋名">

    <select id="roomType">
        <option value="shared">共有ノート</option>
        <option value="readonly">閲覧専用ノート</option>
    </select>

    <button id="joinBtn">入室 / 作成</button>

    <hr>

    <button id="loginBtn">メールログイン</button>
    <button id="signupBtn">新規登録</button>
    <button onclick="location.href='/login/github'">GitHubでログイン</button>
</div>

<div class="main">
    <div class="header">
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="menu-btn" id="menuBtn">☰</div>
            <span id="currentRoom">未接続</span>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
            <button id="inviteBtn" style="width:auto;">招待リンク</button>
            <span id="modeLabel"></span>
        </div>
    </div>

    <div id="note" contenteditable="true"></div>
    <div class="typing" id="typing"></div>
</div>

<script>
let ws;
let isUpdating = false;
let currentRoomName = "";
let username = localStorage.getItem("notecord_username") || "User";

/* ===== メニュー ===== */
document.getElementById("menuBtn").onclick = () => {
    document.querySelector(".sidebar").classList.toggle("open");
};

document.addEventListener("click", (e) => {
    const sidebar = document.querySelector(".sidebar");
    if (!sidebar.contains(e.target) && !e.target.closest("#menuBtn")) {
        sidebar.classList.remove("open");
    }
});

/* ===== rooms ===== */
async function loadRooms() {
    const res = await fetch("/rooms");
    const rooms = await res.json();

    const container = document.getElementById("rooms");
    container.innerHTML = "";

    rooms.forEach(room => {
        const div = document.createElement("div");
        div.className = "room";
        div.textContent = room.name + " (" + room.label + ")";
        div.onclick = () => {
            document.getElementById("roomInput").value = room.name;
            accessRoom();
        };
        container.appendChild(div);
    });
}

/* ===== join ===== */
async function accessRoom() {
    const room = document.getElementById("roomInput").value.trim();
    const type = document.getElementById("roomType").value;

    if (!room) return alert("部屋名を入力");

    const password = prompt("パスワード") || "";

    const res = await fetch("/join-room", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ room, password, room_type: type })
    });

    const result = await res.json();

    if (!result.success) return alert(result.message);

    connectRoom(room, result.can_edit, result.label);
    loadRooms();
}

/* ===== connect ===== */
function connectRoom(room, canEdit, label) {
    document.querySelector(".sidebar").classList.remove("open");

    currentRoomName = room;
    document.getElementById("currentRoom").textContent = "# " + room;
    document.getElementById("modeLabel").textContent = label;

    const note = document.getElementById("note");
    note.contentEditable = canEdit;

    if (ws) ws.close();

    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://")
        + location.host + "/ws/" + room
    );

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "init" || data.type === "update") {
            isUpdating = true;
            note.innerText = data.text;
            isUpdating = false;
        }

        if (data.type === "typing") {
            const typing = document.getElementById("typing");
            typing.textContent = data.user + " が入力中...";
            setTimeout(() => typing.textContent = "", 1000);
        }
    };

    note.oninput = () => {
        if (!canEdit || isUpdating) return;

        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: "update",
                text: note.innerText
            }));
        }
    };
}

/* ===== init ===== */
document.addEventListener("DOMContentLoaded", async () => {
    document.getElementById("joinBtn").onclick = accessRoom;
    await loadRooms();
});
</script>

</body>
</html>
