<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NoteCord</title>

<style>

/* ===== テーマ変数 ===== */
:root {
    --bg: #0f172a;
    --text: white;
    --sidebar: #020617;
    --card: #111827;
    --border: #1e293b;
}

.light {
    --bg: #f1f5f9;
    --text: #0f172a;
    --sidebar: #ffffff;
    --card: #e2e8f0;
    --border: #cbd5e1;
}

/* ===== 全体 ===== */
body {
    margin: 0;
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
}

/* ===== サイドバー ===== */
.sidebar {
    width: 280px;
    background: var(--sidebar);
    padding: 15px;
    border-right: 1px solid var(--border);
}

/* ===== ルーム ===== */
.room {
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
    background: var(--card);
}

.room:hover {
    opacity: 0.8;
}

/* ===== メイン ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* ===== ヘッダー ===== */
.header {
    padding: 10px 15px;
    background: var(--sidebar);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ===== ノート ===== */
#note {
    flex: 1;
    padding: 20px;
    outline: none;
    overflow: auto;
    white-space: pre-wrap;
    font-size: 16px;
}

/* ===== 入力中 ===== */
.typing {
    padding: 10px;
    color: gray;
}

/* ===== 入力UI ===== */
input, button, select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
}

/* ===== ボタン ===== */
button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

/* ===== ハンバーガー ===== */
.menu-btn {
    display: none;
    font-size: 20px;
    cursor: pointer;
}

/* ===== スマホ対応 ===== */
@media (max-width: 768px) {

    body {
        flex-direction: column;
    }

    .menu-btn {
        display: block;
    }

    .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        width: 80%;
        height: 100%;
        z-index: 1000;
        transition: 0.3s;
    }

    .sidebar.open {
        left: 0;
    }

    .main {
        width: 100%;
    }
}

</style>
</head>

<body>

<!-- ===== サイドバー ===== -->
<div class="sidebar" id="sidebar">
    <h2>Rooms</h2>
    <div id="rooms"></div>

    <input id="roomInput" placeholder="部屋名">

    <select id="roomType">
        <option value="shared">共有ノート</option>
        <option value="readonly">閲覧専用</option>
    </select>

    <button id="joinBtn">入室 / 作成</button>

    <hr>

    <button onclick="toggleTheme()">🌗 テーマ切替</button>

    <button onclick="location.href='/login/github'">
        GitHubでログイン
    </button>
</div>

<!-- ===== メイン ===== -->
<div class="main">

    <div class="header">
        <span class="menu-btn" onclick="toggleMenu()">☰</span>

        <span id="currentRoom">未接続</span>

        <div style="display:flex; gap:10px;">
            <button id="inviteBtn">招待</button>
        </div>
    </div>

    <div id="note" contenteditable="true">
ノートに入室した時に表示されます
    </div>

    <div class="typing" id="typing"></div>
</div>

<script type="module">

let ws;
let isUpdating = false;
let currentRoomName = "";

/* ===== ユーザー ===== */
let username = localStorage.getItem("notecord_username");

if (!username) {
    username = prompt("ユーザー名") || "User";
    localStorage.setItem("notecord_username", username);
}

/* ===== テーマ ===== */
function toggleTheme(){
    document.body.classList.toggle("light");
    localStorage.setItem("theme", document.body.classList.contains("light"));
}

if(localStorage.getItem("theme") === "true"){
    document.body.classList.add("light");
}

/* ===== ハンバーガー ===== */
window.toggleMenu = function(){
    document.getElementById("sidebar").classList.toggle("open");
}

/* ===== rooms ===== */
async function loadRooms() {
    const res = await fetch("/rooms");
    const rooms = await res.json();

    const container = document.getElementById("rooms");
    container.innerHTML = "";

    rooms.forEach(room => {
        const div = document.createElement("div");
        div.className = "room";
        div.textContent = room.name + " (" + room.label + ")";
        div.onclick = () => {
            document.getElementById("roomInput").value = room.name;
            accessRoom();
        };
        container.appendChild(div);
    });
}

/* ===== join ===== */
async function accessRoom() {
    const room = document.getElementById("roomInput").value.trim();
    const type = document.getElementById("roomType").value;

    if (!room) return alert("部屋名を入力");

    const password = prompt("パスワード") || "";

    const res = await fetch("/join-room", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ room, password, room_type: type })
    });

    const result = await res.json();

    if (!result.success) return alert(result.message);

    connectRoom(room, result.can_edit);
    loadRooms();
}

/* ===== connect ===== */
function connectRoom(room, canEdit) {

    currentRoomName = room;

    document.getElementById("currentRoom").textContent = "# " + room;

    const note = document.getElementById("note");
    note.contentEditable = canEdit;

    if (ws) ws.close();

    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://")
        + location.host + "/ws/" + room
    );

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "init" || data.type === "update") {
            isUpdating = true;
            note.innerText = data.text;
            isUpdating = false;
        }

        if (data.type === "typing") {
            const typing = document.getElementById("typing");
            typing.textContent = data.user + " が入力中...";
            setTimeout(() => typing.textContent = "", 1000);
        }
    };

    note.oninput = () => {
        if (!canEdit || isUpdating) return;

        ws.send(JSON.stringify({
            type: "update",
            text: note.innerText
        }));

        ws.send(JSON.stringify({
            type: "typing",
            user: username
        }));
    };
}

/* ===== 招待 ===== */
function copyInviteLink() {
    if (!currentRoomName) return;

    const link = location.origin + "/?room=" + currentRoomName;

    navigator.clipboard.writeText(link)
        .then(() => alert("コピーした"))
}

/* ===== init ===== */
document.addEventListener("DOMContentLoaded", async () => {

    document.getElementById("joinBtn").onclick = accessRoom;
    document.getElementById("inviteBtn").onclick = copyInviteLink;

    await loadRooms();
});

</script>

</body>
</html>
