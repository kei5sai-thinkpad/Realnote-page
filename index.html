<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NoteCord</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 280px;
    background: #020617;
    padding: 15px;
    border-right: 1px solid #1e293b;
}

.room {
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
    background: #111827;
}

.room:hover {
    background: #1e293b;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 15px 20px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#note {
    flex: 1;
    padding: 20px;
    outline: none;
    overflow: auto;
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.6;
}

.typing {
    padding: 10px 20px;
    color: #94a3b8;
    min-height: 24px;
}

input, button, select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    box-sizing: border-box;
}

button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Rooms</h2>
    <div id="rooms"></div>

    <input id="roomInput" placeholder="部屋名">

    <select id="roomType">
        <option value="shared">共有ノート</option>
        <option value="readonly">閲覧専用ノート</option>
    </select>

    <button id="joinBtn">入室 / 作成</button>

    <hr>

    <button id="loginBtn">メールログイン</button>
    <button id="signupBtn">新規登録</button>
    <button onclick="location.href='/login/github'">
    GitHubでログイン
</button>
</div>

<div class="main">
    <div class="header">
        <span id="currentRoom">未接続</span>
        <div style="display:flex; gap:10px; align-items:center;">
            <button id="inviteBtn" style="width:auto;">招待リンク</button>
            <span id="modeLabel"></span>
        </div>
    </div>

    <div id="note" contenteditable="true">
        ノートに入室した時に表示されます
    </div>

    <div class="typing" id="typing"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://qwoasmceczpcvkuufvkt.supabase.co",
  "sb_publishable_U3eBuQImXzRhe7irveKkYQ_cw0RVyem"
);

let ws;
let isUpdating = false;
let currentRoomName = "";

/* ===== ユーザー ===== */
let username = localStorage.getItem("notecord_username");

if (!username) {
    username = prompt("ユーザー名を入力してください") || ("User" + Math.floor(Math.random()*1000));
    localStorage.setItem("notecord_username", username);
}

/* ===== Supabase ===== */
async function loginEmail() {
    const email = prompt("メールアドレス");
    const password = prompt("パスワード");

    const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
    });

    if (error) return alert(error.message);

    localStorage.setItem("sb_token", data.session.access_token);
    alert("ログイン成功");
}

async function signupEmail() {
    const email = prompt("メールアドレス");
    const password = prompt("パスワード");

    const { error } = await supabase.auth.signUp({
        email,
        password
    });

    if (error) alert(error.message);
    else alert("メール確認してください");
}

/* ===== rooms ===== */
async function loadRooms() {
    const res = await fetch("/rooms");
    const rooms = await res.json();

    const container = document.getElementById("rooms");
    container.innerHTML = "";

    rooms.forEach(room => {
        const div = document.createElement("div");
        div.className = "room";
        div.textContent = room.name + " (" + room.label + ")";
        div.onclick = () => {
            document.getElementById("roomInput").value = room.name;
            accessRoom();
        };
        container.appendChild(div);
    });
}

/* ===== join ===== */
async function accessRoom() {
    const room = document.getElementById("roomInput").value.trim();
    const type = document.getElementById("roomType").value;

    if (!room) return alert("部屋名を入力");

    const password = prompt("パスワード") || "";

    const res = await fetch("/join-room", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ room, password, room_type: type, username })
    });

    const result = await res.json();

    if (!result.success) return alert(result.message);

    connectRoom(room, result.can_edit, result.label);
    loadRooms();
}

/* ===== connect ===== */
function connectRoom(room, canEdit, label) {
    currentRoomName = room;

    document.getElementById("currentRoom").textContent = "# " + room;
    document.getElementById("modeLabel").textContent = label;

    const note = document.getElementById("note");
    note.contentEditable = canEdit;

    if (ws) ws.close();

    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://")
        + location.host + "/ws/" + room
    );

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "init" || data.type === "update") {
            isUpdating = true;
            note.innerText = data.text;
            isUpdating = false;
        }

        if (data.type === "typing") {
            const typing = document.getElementById("typing");
            typing.textContent = data.user + " が入力中...";
            setTimeout(() => typing.textContent = "", 1000);
        }
    };

    note.oninput = () => {
        if (!canEdit || isUpdating) return;

        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: "update",
                text: note.innerText
            }));

            ws.send(JSON.stringify({
                type: "typing",
                user: username
            }));
        }
    };
}

/* ===== invite ===== */
function copyInviteLink() {
    if (!currentRoomName) return alert("未接続");

    const link = location.origin + "/?room=" + currentRoomName;

    navigator.clipboard.writeText(link)
        .then(() => alert("コピー完了"))
        .catch(() => alert("失敗"));
}

/* ===== init ===== */
document.addEventListener("DOMContentLoaded", async () => {

    document.getElementById("joinBtn").addEventListener("click", accessRoom);
    document.getElementById("loginBtn").addEventListener("click", loginEmail);
    document.getElementById("signupBtn").addEventListener("click", signupEmail);
    document.getElementById("inviteBtn").addEventListener("click", copyInviteLink);

    await loadRooms();

    const params = new URLSearchParams(location.search);
    const room = params.get("room");

    if (room) {
        document.getElementById("roomInput").value = room;
        accessRoom();
    }
});
</script>

</body>
</html>
