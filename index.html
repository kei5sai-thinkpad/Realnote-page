<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NoteCord</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    height: 100vh;
}

/* ===== sidebar ===== */
.sidebar {
    width: 280px;
    background: #020617;
    padding: 15px;
    border-right: 1px solid #1e293b;
}

.room {
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
    background: #111827;
}

.room:hover {
    background: #1e293b;
}

/* ===== main ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 15px 20px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#note {
    flex: 1;
    padding: 20px;
    outline: none;
    overflow: auto;
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.6;
    background: #0f172a;
}

.typing {
    padding: 10px 20px;
    color: #94a3b8;
    min-height: 24px;
}

input, button, select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    box-sizing: border-box;
}

button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- ===== sidebar ===== -->
<div class="sidebar">
    <h2>Rooms</h2>
    <div id="rooms"></div>

    <input id="roomInput" placeholder="部屋名">

    <select id="roomType">
        <option value="shared">共有ノート</option>
        <option value="readonly">閲覧専用ノート</option>
    </select>

    <button onclick="accessRoom()">入室 / 作成</button>

    <hr>

    <!-- Firebaseログイン -->
    <button onclick="loginGoogle()">Googleログイン</button>
    <div id="userInfo"></div>
</div>

<!-- ===== main ===== -->
<div class="main">
    <div class="header">
        <span id="currentRoom">未接続</span>

        <div style="display:flex; gap:10px; align-items:center;">
            <button onclick="copyInviteLink()" style="width:auto;">
                招待リンク
            </button>

            <span id="modeLabel"></span>
        </div>
    </div>

    <div id="note" contenteditable="true">
        ログインして部屋に入室してください
    </div>

    <div class="typing" id="typing"></div>
</div>

<script type="module">
/* ================= Firebase ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
    getAuth,
    signInWithPopup,
    GoogleAuthProvider
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let token = null;
let username = null;

/* ================= login ================= */
window.loginGoogle = async () => {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);

    const user = result.user;
    token = await user.getIdToken();

    username = user.displayName;

    document.getElementById("userInfo").innerText =
        "👤 " + username;

    alert("ログイン成功");
};

/* ================= WebSocket ================= */
let ws;
let isUpdating = false;
let currentRoomName = "";

function connectRoom(room, canEdit, label) {
    currentRoomName = room;

    document.getElementById("currentRoom").innerText = "# " + room;
    document.getElementById("modeLabel").innerText = label;

    const note = document.getElementById("note");
    note.contentEditable = canEdit ? "true" : "false";

    if (ws) ws.close();

    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://")
        + location.host + "/ws/" + room + "?token=" + token
    );

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "init" || data.type === "update") {
            isUpdating = true;
            note.innerText = data.text;
            isUpdating = false;
        }

        if (data.type === "typing") {
            const typing = document.getElementById("typing");
            typing.innerText = data.user + " が入力中...";
            setTimeout(() => typing.innerText = "", 1000);
        }
    };

    note.oninput = () => {
        if (!canEdit) return;

        if (ws && ws.readyState === WebSocket.OPEN && !isUpdating) {
            ws.send(JSON.stringify({
                type: "update",
                text: note.innerText
            }));

            ws.send(JSON.stringify({
                type: "typing",
                user: username
            }));
        }
    };
}

/* ================= rooms ================= */
async function loadRooms() {
    const res = await fetch("/rooms");
    const rooms = await res.json();

    const container = document.getElementById("rooms");
    container.innerHTML = "";

    rooms.forEach(room => {
        const div = document.createElement("div");
        div.className = "room";
        div.innerText = room.name + " (" + room.label + ")";
        div.onclick = () => {
            document.getElementById("roomInput").value = room.name;
            accessRoom();
        };
        container.appendChild(div);
    });
}

window.accessRoom = async () => {
    if (!token) {
        alert("先にGoogleログインしてください");
        return;
    }

    const room = document.getElementById("roomInput").value.trim();
    const type = document.getElementById("roomType").value;

    if (!room) return alert("部屋名を入力してください");

    const res = await fetch("/join-room", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            room,
            password: "",
            room_type: type
        })
    });

    const result = await res.json();

    if (!result.success) {
        alert(result.message);
        return;
    }

    connectRoom(room, result.can_edit, result.label);
    loadRooms();
};

/* ================= invite ================= */
window.copyInviteLink = () => {
    if (!currentRoomName) return alert("先に部屋へ入室");

    const link = location.origin + "/?room=" + currentRoomName;

    navigator.clipboard.writeText(link);
    alert("コピーしました");
};

/* ================= auto join ================= */
window.onload = async () => {
    await loadRooms();

    const params = new URLSearchParams(location.search);
    const room = params.get("room");

    if (room) {
        document.getElementById("roomInput").value = room;
    }
};
</script>

</body>
</html>
